# Who gets what share of a venue's budget when they compete.
#
# An unconfigured caller falls to `defaults` — which is deliberately NOT the
# lowest class, so a new bot works sensibly before anyone configures it. That
# cuts the other way too: a bot meant to be `bulk` that sends an unconfigured
# name silently gets `standard`, which is twice the share it was supposed to
# have. Every process a bot runs therefore belongs here by name.

[defaults]
class = "standard"

[classes.trading]
weight = 8

[classes.standard]
weight = 2

[classes.bulk]
weight = 1

# Example latency-sensitive collector.
[callers.collector]
class = "trading"
project = "Signal Collector"
[callers.collector-scanner]
class = "trading"
project = "Signal Collector"
[callers.collector-us-trades]
class = "trading"
project = "Signal Collector"

# Example bulk observer. Promote whichever process becomes latency-sensitive;
# a class is policy, not a property of a project.
[callers.execution]
class = "bulk"
project = "Execution Bot"
[callers.execution-lag]
class = "bulk"
project = "Execution Bot"
[callers.execution-whales]
class = "bulk"
project = "Execution Bot"
[callers.execution-x]
class = "bulk"
project = "Execution Bot"
[callers.execution-watch-football]
class = "bulk"
project = "Execution Bot"
[callers.execution-reconcile]
class = "bulk"
project = "Execution Bot"
[callers.execution-cockpit]
class = "bulk"
project = "Execution Bot"
[callers.execution-doctor]
class = "bulk"
project = "Execution Bot"

# Example standard research worker.
[callers.research]
class = "standard"
project = "Market Research"
